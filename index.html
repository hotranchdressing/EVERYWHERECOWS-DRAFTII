<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cow Parts</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://use.typekit.net/lbj5pgi.css">
</head>
<body>

  <div class="title-row">
    <h1>0</h1>
    <p><b>COW</b></p>
  </div>

  <div class="page-container">
    <div class="cow-container">
      <img src="images/COW.png" id="central-cow" alt="Central Cow">

      <div class="part-wrapper" id="wrapper-hide">
        <a href="hide.html">
        <img src="images/HIDE.png" class="cow-part" alt="Hide Part">
        </a>
      </div>

      <div class="part-wrapper" id="wrapper-muscle">
        <img src="images/MUSCLE.png" class="cow-part" alt="Muscle Part">
      </div>

      <div class="part-wrapper" id="wrapper-skeleton">
        <img src="images/SKELETON.png" class="cow-part" alt="Skeleton Part">
      </div>

      <div class="part-wrapper" id="wrapper-viscera">
        <img src="images/VISCERA.png" class="cow-part" alt="Viscera Part">
      </div>

      <div class="part-wrapper" id="wrapper-fat">
        <img src="images/fat.png" class="cow-part" alt="Fat Part">
      </div>

    </div>
  </div>

  <script src="cow-animation.js"></script>
</body>
</html>
